description = "Agente modular de insights de vendas com SQLite, OpenAI e PowerPoint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "openai>=2.41.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
