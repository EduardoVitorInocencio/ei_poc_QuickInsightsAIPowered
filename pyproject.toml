    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "streamlit>=1.46.0",
    "sqlalchemy>=2.0.50",
    "sqlite-utils>=3.39",
    "uvicorn>=0.49.0",
]
